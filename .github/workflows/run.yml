name: threads-to-instagram
on:
  # schedule:                 # 판형 교체 전까지 일시정지 (2026-11-27)
  #   - cron: "17 * * * *"
  workflow_dispatch:           # 수동 실행 버튼
    inputs:
      force_latest:
        description: "최신 Threads 글 1개를 바로 인스타에 게시 (테스트용)"
        type: boolean
        default: false
      post_today:
        description: "오늘(한국시간) 올린 Threads 글을 전부 게시"
        type: boolean
        default: false
      delete_auto_posts:
        description: "자동 게시물 삭제: dry(목록만) / yes(삭제)"
        type: string
        default: ""
      max_per_run:
        description: "이번 실행에서 최대 게시 개수"
        type: string
        default: "3"
permissions:
  contents: write
concurrency: t2i
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          pip install requests playwright pillow && python -m playwright install chromium
      - name: run
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HASHTAGS: "#주식공부 #투자공부 #윤타"
          FORCE_LATEST: ${{ inputs.force_latest && '1' || '0' }}
          POST_TODAY: ${{ inputs.post_today && '1' || '0' }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
          DELETE_AUTO: ${{ inputs.delete_auto_posts }}
        run: |
          git config user.name "t2i-bot" && git config user.email "bot@users.noreply.github.com"
          python main.py
      - name: save state
        run: |
          git add state/ && git commit -m "state" || true
          git push || true
