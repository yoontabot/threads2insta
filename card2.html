<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#FBF7EC; overflow:hidden;
         font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif; color:#161616; }
  .page { position:relative; width:1080px; height:1350px; padding:70px 84px 0;
          display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:flex-end;
         border-bottom:3px solid #111; padding-bottom:16px; }
  .brand { font-family:"Noto Serif CJK KR",serif; font-weight:900; font-size:34px; }
  .meta { font-size:24px; color:#666; }
  .lead { font-family:"Noto Serif CJK KR",serif; font-weight:900; line-height:1.42;
          margin-top:44px; word-break:keep-all; }
  .lead mark { background:linear-gradient(transparent 55%, #FFE24A 55% 92%, transparent 92%);
               color:inherit; padding:0 4px; }
  .body { margin-top:26px; line-height:1.62; white-space:pre-wrap; word-break:keep-all; color:#222; }
  .panelwrap { flex:1; display:flex; align-items:center; justify-content:center;
               margin:34px 0 30px; min-height:0; }
  .panel { position:relative; max-width:100%; max-height:100%; border:4px solid #111;
           background:#fff; box-shadow:10px 10px 0 #111; display:flex; }
  .panel img { display:block; max-width:904px; max-height:var(--ph); object-fit:contain; }
  .pen { position:absolute; right:-18px; top:-22px; font-family:"Noto Serif CJK KR",serif;
         font-weight:900; font-size:26px; color:#D7261E; transform:rotate(6deg);
         background:#FBF7EC; padding:2px 10px; border:2.5px solid #D7261E; border-radius:30px; }
  .foot { height:96px; border-top:1px solid #111; display:flex; justify-content:space-between;
          align-items:center; font-size:24px; color:#444; margin-top:auto; }
  .foot .blue { color:#1D4FD8; font-weight:700; }
</style></head>
<body><div class="page">
  <div class="top"><div class="brand">{{BRAND}}</div><div class="meta">{{DATE}}</div></div>
  {{LEAD}}
  {{BODY}}
  {{PANEL}}
  <div class="foot"><span>{{HANDLE}} · Threads</span><span class="blue">{{PAGENO}}</span></div>
</div></body></html>
